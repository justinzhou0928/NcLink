name: build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 集成测试需要一个真实 MQTT Broker；没有 Broker 时集成用例会自动跳过，
    # 因此这里启动 EMQX 让集成测试真正跑起来。
    services:
      emqx:
        image: emqx/emqx:5.3.0
        ports:
          - 1883:1883
          - 18083:18083

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Wait for EMQX
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1883) >/dev/null 2>&1; then
              echo "MQTT broker is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MQTT broker did not become ready"
          exit 1

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
